name: Keep scheduled workflow alive

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .monitor-heartbeat
          git config user.name "nowscore-monitor"
          git config user.email "nowscore-monitor@users.noreply.github.com"
          git add .monitor-heartbeat
          git commit -m "chore: monitor heartbeat [skip ci]" || exit 0
          git push
