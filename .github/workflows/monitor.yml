name: NowScore 多模型盘口监控

on:
  schedule:
    # 每5分钟扫描一次。常见 :00/:15/:30/:45 开球可在 T-10 节点进入最终确认窗口。
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "只测试 Server酱微信推送"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nowscore-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan and notify odds patterns
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UPCOMING_WINDOW_MINUTES: "180"
          FINAL_ALERT_WINDOW_MINUTES: "10"
          MIN_MATCH_COUNT: "4"
          QUARTER_REVERSAL_MIN_SCORE: "5"
          WATCH_MATCH_IDS: ""
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push || false }}
        run: python scan.py

      - name: Persist dedup state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_push) }}
        run: |
          if [ -z "$(git status --porcelain -- data/state.json)" ]; then
            echo "No state change"
            exit 0
          fi

          # 先保存本轮扫描生成的状态文件。
          cp data/state.json /tmp/state.json

          # 重新同步 main 最新版本，避免运行期间仓库被更新导致 non-fast-forward。
          git fetch origin main
          git reset --hard origin/main

          # 把本轮最新状态恢复到同步后的工作区。
          cp /tmp/state.json data/state.json

          if [ -z "$(git status --porcelain -- data/state.json)" ]; then
            echo "State already present on latest main"
            exit 0
          fi

          git config user.name "nowscore-monitor"
          git config user.email "nowscore-monitor@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update monitor state [skip ci]"
          git push origin HEAD:main
