name: NowScore 多模型盘口监控

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "只测试 Server酱微信推送"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nowscore-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scan.py pk_fake_strong_away.py jev_decision.py
      - name: Scan and notify odds patterns with JEV formal gate
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ENABLED: "true"
          JEV_FALSE_STRONG_MIN: "0.50"
          JEV_AWAY_NOT_LOSE_MIN: "0.70"
          JEV_STRONG_HOME_MAX: "0.30"
          UPCOMING_WINDOW_MINUTES: "180"
          FINAL_ALERT_WINDOW_MINUTES: "10"
          MIN_MATCH_COUNT: "4"
          QUARTER_REVERSAL_MIN_SCORE: "5"
          PKRH_MIN_SCORE: "6"
          WATCH_MATCH_IDS: ""
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push || false }}
        run: python scan.py
      - name: Persist monitor state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_push) }}
        run: |
          mkdir -p data
          if [ -z "$(git status --porcelain -- data/state.json)" ]; then
            echo "No state change"
            exit 0
          fi
          cp data/state.json /tmp/state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/state.json data/state.json
          if [ -z "$(git status --porcelain -- data/state.json)" ]; then
            echo "State already present on latest main"
            exit 0
          fi
          git config user.name "nowscore-monitor"
          git config user.email "nowscore-monitor@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update monitor state [skip ci]"
          git push origin HEAD:main
