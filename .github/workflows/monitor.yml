name: 半球假强主队监控

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "只测试 Server酱微信推送"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nowscore-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scan and notify half-ball fake favorite
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UPCOMING_WINDOW_MINUTES: "180"
          MIN_MATCH_COUNT: "4"
          WATCH_MATCH_IDS: ""
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push || false }}
        run: python scan.py
      - name: Scan quarter-ball PH01-PH06 with frozen 500-match policy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_push) }}
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UPCOMING_WINDOW_MINUTES: "180"
          WATCH_MATCH_IDS: ""
        run: python quarter_scan.py
      - name: Persist dedup state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_push) }}
        run: |
          if [ -z "$(git status --porcelain -- data/state.json data/quarter_state.json)" ]; then
            echo "No state change"
            exit 0
          fi
          git config user.name "nowscore-monitor"
          git config user.email "nowscore-monitor@users.noreply.github.com"
          git add data/state.json
          if [ -f data/quarter_state.json ]; then
            git add data/quarter_state.json
          fi
          git commit -m "chore: update monitor state [skip ci]"
          git push
