name: 半球假强主队监控

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nowscore-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan and notify
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UPCOMING_WINDOW_MINUTES: "180"
          MIN_MATCH_COUNT: "4"
          WATCH_MATCH_IDS: ""
        run: python scan.py

      - name: Persist dedup state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "nowscore-monitor"
          git config user.email "nowscore-monitor@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update monitor state [skip ci]"
          git push
