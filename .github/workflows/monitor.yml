name: NowScore 多模型盘口监控

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "只测试 Server酱微信推送"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nowscore-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Syntax check
        run: python -m py_compile scan.py pk_fake_strong_away.py jev_decision.py jev_shadow.py jev_shadow_scan.py

      - name: Scan and notify odds patterns
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UPCOMING_WINDOW_MINUTES: "180"
          FINAL_ALERT_WINDOW_MINUTES: "10"
          MIN_MATCH_COUNT: "4"
          QUARTER_REVERSAL_MIN_SCORE: "5"
          PKRH_MIN_SCORE: "6"
          WATCH_MATCH_IDS: ""
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push || false }}
        run: python scan.py

      - name: V7 JEV Shadow live validation
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_push) }}
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ENABLED: "true"
          UPCOMING_WINDOW_MINUTES: "180"
          FINAL_ALERT_WINDOW_MINUTES: "10"
          MIN_MATCH_COUNT: "4"
          WATCH_MATCH_IDS: ""
        run: python jev_shadow_scan.py

      - name: Persist monitor and JEV shadow state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_push) }}
        run: |
          mkdir -p data
          changed=false
          if [ -n "$(git status --porcelain -- data/state.json data/jev_shadow.jsonl)" ]; then
            changed=true
          fi
          if [ "$changed" = false ]; then
            echo "No state/shadow change"
            exit 0
          fi

          [ -f data/state.json ] && cp data/state.json /tmp/state.json || true
          [ -f data/jev_shadow.jsonl ] && cp data/jev_shadow.jsonl /tmp/jev_shadow.jsonl || true

          git fetch origin main
          git reset --hard origin/main

          [ -f /tmp/state.json ] && cp /tmp/state.json data/state.json || true
          [ -f /tmp/jev_shadow.jsonl ] && cp /tmp/jev_shadow.jsonl data/jev_shadow.jsonl || true

          if [ -z "$(git status --porcelain -- data/state.json data/jev_shadow.jsonl)" ]; then
            echo "State/shadow already present on latest main"
            exit 0
          fi

          git config user.name "nowscore-monitor"
          git config user.email "nowscore-monitor@users.noreply.github.com"
          git add data/state.json data/jev_shadow.jsonl 2>/dev/null || true
          git commit -m "chore: update monitor and JEV shadow state [skip ci]"
          git push origin HEAD:main
