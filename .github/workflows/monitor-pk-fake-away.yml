name: NowScore PKRH 平手假强客队监控

on:
  schedule:
    # 与原 monitor.yml 错开2分钟，仍保持每5分钟扫描，减少State提交竞争。
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "只测试PKRH Server酱微信推送"
        required: false
        default: false
        type: boolean
      match_ids:
        description: "可选：手工指定比赛ID，多个用逗号分隔"
        required: false
        default: ""
        type: string
      force_eval:
        description: "仅手工诊断：忽略开赛时间窗口，只打印分析，不推送"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nowscore-pkrh-monitor
  cancel-in-progress: false

jobs:
  scan-pkrh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Syntax check
        run: python -m py_compile pk_fake_strong_away.py pk_scan.py

      - name: Scan PKRH pattern
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UPCOMING_WINDOW_MINUTES: "180"
          PKRH_WINDOW_MINUTES: "180"
          PKRH_FINAL_WINDOW_MINUTES: "10"
          PKRH_MIN_SCORE: "6"
          PKRH_WATCH_MATCH_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.match_ids || '' }}
          PKRH_FORCE_EVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_eval || false }}
          PKRH_TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push || false }}
        run: python pk_scan.py

      - name: Persist PKRH dedup state
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.test_push || inputs.force_eval)) }}
        run: |
          STATE=data/pk_fake_strong_away_state.json
          if [ ! -f "$STATE" ] || [ -z "$(git status --porcelain -- "$STATE")" ]; then
            echo "No PKRH state change"
            exit 0
          fi

          cp "$STATE" /tmp/pkrh-state.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/pkrh-state.json "$STATE"

          if [ -z "$(git status --porcelain -- "$STATE")" ]; then
            echo "PKRH state already present on latest main"
            exit 0
          fi

          git config user.name "nowscore-pkrh-monitor"
          git config user.email "nowscore-pkrh-monitor@users.noreply.github.com"
          git add "$STATE"
          git commit -m "chore: update PKRH monitor state [skip ci]"
          git push origin HEAD:main
