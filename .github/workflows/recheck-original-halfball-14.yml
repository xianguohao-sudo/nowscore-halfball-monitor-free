name: 原始半球假强14场复核

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Reconstruct odds at original alert time and recheck
        run: python history_collector/recheck_original_halfball_14.py
      - name: Show result
        if: always()
        run: |
          echo '=== SUMMARY ==='
          cat data/recheck_original_halfball_14/summary.json 2>/dev/null || true
          echo '=== REPORT ==='
          cat data/recheck_original_halfball_14/report.csv 2>/dev/null || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-halfball-14-recheck-${{ github.run_id }}
          path: data/recheck_original_halfball_14/**
          retention-days: 30
          if-no-files-found: warn
